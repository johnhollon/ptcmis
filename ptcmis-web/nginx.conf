worker_processes  1; # 根据 CPU 核心数自动调整工作进程数，充分利用多核性能

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 开启 Gzip 压缩，显著减少静态资源体积，加快页面加载速度
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 5;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/jpeg image/gif image/png svg+xml;
    gzip_vary on;

    sendfile        on;
    tcp_nopush      on; # 配合 sendfile 使用，提高网络包传输效率
    tcp_nodelay     on; # 禁用 Nagle 算法，减小小包延迟，对实时交互更好

    keepalive_timeout  65;

    server {
        listen       9006;
        server_name  localhost;
        root   D:/ptcmis/ptcmis-web;
        index  index.html index.htm;

        # 添加字符集，防止前端中文乱码
        charset utf-8;

        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;

            # 对静态资源关闭访问日志，减少磁盘 I/O 读写
            access_log off;
        }

        # 首页（或入口 HTML）绝对不缓存，确保用户每次能获取最新版本
        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~* \.(html)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # SPA 路由重定向
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
