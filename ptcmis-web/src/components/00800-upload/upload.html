<div class="upload-panel">
  <h2>上传文件 <span class="close" (click)="requestClose()">&times;</span></h2>
  <div class="drop-zone" [class.hide]="uploading()"
       [class.drop-zone--over]="isDragOver"
       (dragenter)="onDragEnter($event)"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)">
    <mat-icon>cloud_upload</mat-icon>
    <p>拖拽文件到此处</p>
    <input #fileInput type="file" multiple style="display:none" [accept]="accept" (change)="onFileSelect($event)" />
    <button matButton (click)="fileInput.click()" [disabled]="uploading()">选择文件</button>
  </div>

  @if (fileItems.length > 0) {
    <mat-list class="file-list">
      @for (item of fileItems; track item.name; ) {
        <mat-list-item [class.error]="!!item.error">
          <mat-icon matListItemIcon>
            {{ !!item.error ? 'warning' : 'insert_drive_file' }}
          </mat-icon>
          <span matListItemTitle class="file-name">{{ item.name }}</span>
          <span matListItemLine class="file-size" [matTooltip]="item.error">{{ !!item.error ? item.error : formatSize(item.size) }}</span>
        </mat-list-item>
      }
    </mat-list>
  }
  <div class="panel-footer">
    <button matButton="text" (click)="clearAll()" [disabled]="fileItems.length < 1 || uploading()">清空</button>
    <button matButton="filled" (click)="onTriggerUpload()" [showProgress]="uploading()" [disabled]="fileItems.length < 1 || uploading()">
      开始上传
      <mat-progress-spinner
        progressIndicator
        mode="indeterminate"
        diameter="20"
        tabindex=""
      />
    </button>
  </div>
</div>
