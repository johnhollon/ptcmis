<!--页面主体-->
<layout-page-function-simple
  [loading]="loadingSig()"
  [loadingMessage]="loadingMessageSig()"
>

  <!--标题区域-->
  <layout-page-function-simple-title titleText="打印设置"
                                     data-content-for="title">
  </layout-page-function-simple-title>

  <!--查询区域-->
  <div data-content-for="content">
    <layout-drawer-opp-simple>
      <fieldset data-content-for="content" class="form-container">
        <legend>选择打印机</legend>
        <div class="form">
          @if (printersSig().length > 0) {
            <mat-selection-list [multiple]="false">
              @for (printer of printersSig(); track printer.name) {
                <mat-list-option togglePosition="before" [value]="printer.name" [selected]="printer.selected"
                                 (click)="requestSetPrinter(printer.name)">{{ printer.name }}
                </mat-list-option>
              }
            </mat-selection-list>
          } @else {
            <div style="margin:24px 0;">
              没有找到打印机。应首先下载并安装<a href="http://192.168.100.218:9006/ptcmis-printer-drivers.zip" target="_blank">打印组件</a>。
            </div>
          }
        </div>
      </fieldset>
    </layout-drawer-opp-simple>
  </div>
</layout-page-function-simple>
