<!--页面主体-->
<layout-page-function-simple
  #pageRef
  [loading]="loadingSig()"
  [loadingMessage]="loadingMessageSig()"
  (onDrawerClosed)="onDrawerClosed()"
  (onDrawerOpened)="onDrawerOpened()"
>

  <!--标题区域-->
  <layout-page-function-simple-title titleText="品种信息"
                                     data-content-for="title">
    <!--标题补充信息及插槽 titleDescriptionOutlet-->
    <ng-template cdkPortalOutlet #titleDescriptionOutlet data-content-for="description"></ng-template>
    <!--标题按钮区域及插槽 titleButtonsOutlet-->
    <ng-template cdkPortalOutlet #titleButtonsOutlet data-content-for="buttons"></ng-template>
  </layout-page-function-simple-title>

  <!--查询区域-->
  <layout-query-simple data-content-for="content">

    <!--过滤条件区域-->
    <ng-container data-content-for="filters" [formGroup]="filtersFormGroup">
      <!--按名称过滤-->
      <mat-form-field appearance="outline" floatLabel="always">
        <mat-label>按名称过滤</mat-label>
        <input matInput formControlName="keyword">
      </mat-form-field>

      <button matIconButton matTooltip="刷新" (click)="requestQuery()">
        <mat-icon>refresh</mat-icon>
      </button>
    </ng-container>

    <!--查询结果区域-->
    <table data-content-for="table"
           mat-table
           [dataSource]="tableDataSource"
           [trackBy]="trackByName">
      <!-- Column 品种名称 -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>品种名称</th>
        <td mat-cell *matCellDef="let item"> {{ item.name }}</td>
      </ng-container>
      <!-- Column 状态 -->
      <ng-container matColumnDef="enabled">
        <th mat-header-cell *matHeaderCellDef>状态</th>
        <td mat-cell *matCellDef="let item">
          @if (item.enabled === APIConst.booleans.BOOLEAN_TRUE) {
            已启用
          } @else {
            <span class="text-error">已禁用</span>
          }
        </td>
      </ng-container>
      <!-- Column 操作 -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>操作</th>
        <td mat-cell *matCellDef="let item">
          <button matIconButton matTooltip="操作菜单"
                  [matMenuTriggerFor]="templateOppMenu"
                  [matMenuTriggerData]="{ item: item, enabled:item.enabled === APIConst.booleans.BOOLEAN_TRUE }"
                  (menuOpened)="onOppMenuOpened(item)"
                  (menuClosed)="onOppMenuClosed()">
            <mat-icon>apps</mat-icon>
          </button>
        </td>
      </ng-container>
      <!--thead 模板-->
      <tr mat-header-row *matHeaderRowDef="TABLE_COLUMNS; sticky: true"></tr>
      <!--tbody 模板-->
      <tr mat-row *matRowDef="let item; columns: TABLE_COLUMNS;"
          [class.text-error]="item.enabled !== APIConst.booleans.BOOLEAN_TRUE"
          [matContextMenuTriggerFor]="templateOppMenu"
          [matContextMenuTriggerData]="{ item: item, enabled:item.enabled === APIConst.booleans.BOOLEAN_TRUE }"
          (menuOpened)="onOppMenuOpened(item)"
          (menuClosed)="onOppMenuClosed()"
          [class.menu-opened]="oppMenuSelectedModelSig() === item"></tr>
    </table>

    <!--分页区域-->
    <paginator data-content-for="pagination"
               [page]="paginationSig()"
               (change)="onPageChanged($event)"
               aria-label="Select page">
    </paginator>
  </layout-query-simple>

  <!--drawer区域及插槽 drawerOutlet-->
  <ng-template cdkPortalOutlet #drawerOutlet data-content-for="drawer"></ng-template>
</layout-page-function-simple>

<!--标题附属信息模板-->
<ng-container>
  <!--标题附属信息模板 - 查看详情 - titleDescriptionPortalView-->
  <ng-template #titleDescriptionPortalView>查看详情</ng-template>
  <!--标题附属信息模板 - 编辑 - titleDescriptionPortalEdit-->
  <ng-template #titleDescriptionPortalEdit>编辑</ng-template>
</ng-container>

<!--标题按钮区域模板-->
<ng-container>
  <!--标题按钮区域模板 - 新增 - titleButtonsPortalAdd-->
  <ng-template #titleButtonsPortalAdd>
    <button matButton="filled" (click)="requestAdd()">
      <mat-icon>add</mat-icon>
      新增
    </button>
  </ng-template>
</ng-container>

<!--编辑Drawer区域模板-->
<ng-container>
  <!--编辑Drawer区域模板 - 查看 - drawerPortalView-->
  <ng-template #drawerPortalView>
    <variety-viewer [model]="selectedModelSig()" (onCancel)="closeDrawer()"></variety-viewer>
  </ng-template>
  <!--编辑Drawer区域模板 - 编辑 - drawerPortalEdit-->
  <ng-template #drawerPortalEdit>
    <variety-editor [model]="selectedModelSig()" (onSave)="doSave($event)" (onCancel)="closeDrawer()"></variety-editor>
  </ng-template>
</ng-container>

<!--其它界面所需要的模板-->
<ng-container>
  <mat-menu #templateOppMenu="matMenu" [hasBackdrop]="false">
    <ng-template matMenuContent let-item="item">
      <button mat-menu-item (click)="requestView(item)">
        <mat-icon>search</mat-icon>
        查看
      </button>
      <button mat-menu-item (click)="requestEdit(item)">
        <mat-icon>edit</mat-icon>
        编辑
      </button>
      <button mat-menu-item>
        <mat-icon>close</mat-icon>
        关闭
      </button>
    </ng-template>
  </mat-menu>

</ng-container>
