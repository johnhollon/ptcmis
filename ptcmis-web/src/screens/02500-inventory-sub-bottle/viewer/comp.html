<process-do-inventory-out
  [class.hidden]="subModule !== 'process'"
  [model]="model"
  [editable]="false"
  (onCancel)="onCancel.emit()"
  (onRequestStartLoading)="onRequestStartLoading.emit($event)"
  (onRequestStopLoading)="onRequestStopLoading.emit()"
></process-do-inventory-out>
<archive-inventory-out
  [class.hidden]="subModule !== 'archive'"
  [model]="model"
  [editable]="false"
  description="执行任务出库"
  (onCancel)="onCancel.emit()"
  (onRequestStartLoading)="onRequestStartLoading.emit($event)"
  (onRequestStopLoading)="onRequestStopLoading.emit()"
></archive-inventory-out>
