<layout-drawer-opp-simple>

  <!--编辑区-->
  <fieldset [formGroup]="form" data-content-for="content" class="form-container">
    <legend>编辑品种编号信息</legend>
    <div class="form">
      <select-variety class="col2" formControlName="variety"></select-variety>
      <div class="break"></div>
      <mat-form-field appearance="outline" class="col2" floatLabel="always">
        <mat-label>品种编号</mat-label>
        <input matInput formControlName="code">
        @if (form.get('code')?.touched && form.get('code')?.invalid) {
          <mat-error>{{ form.get('code')?.errors?.['error'] || '' }}</mat-error>
        }
      </mat-form-field>
      <div class="break"></div>
      <div class="col1">
        <mat-radio-group class="col2" formControlName="important">
          <mat-radio-button [value]="APIConst.booleans.BOOLEAN_TRUE">重点品种</mat-radio-button>
          <mat-radio-button [value]="APIConst.booleans.BOOLEAN_FALSE">普通品种</mat-radio-button>
        </mat-radio-group>
      </div>
      <div class="break"></div>
      <div class="col1">
        <mat-radio-group class="col2" formControlName="enabled">
          <mat-radio-button [value]="APIConst.booleans.BOOLEAN_TRUE">启用</mat-radio-button>
          <mat-radio-button [value]="APIConst.booleans.BOOLEAN_FALSE">禁用</mat-radio-button>
        </mat-radio-group>
      </div>
    </div>
  </fieldset>

  <!--操作按钮区-->
  <ng-container data-content-for="toolbar">
    <button matButton="text" (click)="requestCancel()">取消</button>
    <button matButton="filled" (click)="requestSave()">保存</button>
  </ng-container>

</layout-drawer-opp-simple>
