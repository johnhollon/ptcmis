@if(updateVersionSig() >= 0){
  <div class="code-main" [class.discard]="model?.status === 'discard'">
    <div class="signal" [matTooltip]="model?.status === 'discard' ? '已淘汰' : ''"></div>
    <div class="code">{{ model?.id || '' }}</div>
    <div style="flex:1;"></div>
    @if (model.status === 'discard') {
      <div class="info" [class.readonly]="!editable" [matTooltip]="'淘汰： ' + model.reason + (editable ? ' 点击编辑' : '')"
           (click)="editable ? onRequestUpdateDiscardReason.emit(model) : undefined">{{ model.reason }}
      </div>
    }
    @if (loadingSig()) {
      <mat-spinner [diameter]="20"></mat-spinner>
    } @else if (model.status === 'discard') {
      <div class="info readonly" [matTooltip]="'瓶内' + model.plants + '株'">{{ model.plants }}</div>
    }
    @if (editable) {
      @if (model.status === 'discard') {
        <button matIconButton matTooltip="恢复" (click)="onRequestUpdateToNormal.emit(model.id)">
          <mat-icon>replay_circle_filled</mat-icon>
        </button>
      } @else {
        <button matIconButton matTooltip="淘汰" (click)="onRequestUpdateToDiscard.emit(model.id)">
          <mat-icon>bug_report</mat-icon>
        </button>
      }
    }
  </div>
