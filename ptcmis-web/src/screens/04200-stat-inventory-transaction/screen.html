<!--页面主体-->
<layout-page-function-simple
  [loading]="loadingSig()"
  [loadingMessage]="loadingMessageSig()"
>

  <!--标题区域-->
  <layout-page-function-simple-title titleText="库存流水" data-content-for="title">
<!--    <ng-container data-content-for="buttons">-->
<!--      <button matButton="filled" (click)="service.requestExportExcel()">-->
<!--        <mat-icon>download_for_offline</mat-icon>-->
<!--        导出 Excel-->
<!--      </button>-->
<!--    </ng-container>-->
  </layout-page-function-simple-title>

  <!--查询区域-->
  <div class="layout-query-simple" data-content-for="content">
    <fieldset class="filters-container">
      <legend>统计维度/统计结果</legend>
      @if (service.updateVersionSig() >= 0) {
        <!--过滤条件区域-->
        <filters-stat-inventory-transaction
          (onConditionChanged)="requestConditionChanged($event)"
          (onQuery)="requestQuery($event)"
          (onExport)="requestExport($event)"
        ></filters-stat-inventory-transaction>
      }
    </fieldset>

    <cdk-virtual-scroll-viewport class="table-container" [itemSize]="52" [maxBufferPx]="2080" [minBufferPx]="840">
      @if (service.updateVersionSig() >= 0) {
        <table-stat-inventory-transaction></table-stat-inventory-transaction>
      }
    </cdk-virtual-scroll-viewport>

  </div>
</layout-page-function-simple>
