<div class="code-main">
  <div class="content">
    <div class="code">
      <div class="self-id">{{ model.code }}</div>
    </div>
    <div class="info">
      <span>
        品种：<span [matTooltip]="model.varietyCode">{{ model.varietyCode }}</span>
      </span>
    </div>
    <div class="info">
      <span>
        批次：<span>{{ model.explantCollectionBatch || '——' }}</span>
      </span>
      <span>
        代数：<span>{{ model.generation }}</span>
      </span>
    </div>
    <div class="info">
      <span>
        操作：{{ model.operatorName || '未知' }}
      </span>
      <span>
        {{ (model.operateTime | timestamp) || '未知' }}
      </span>
    </div>
  </div>
</div>
