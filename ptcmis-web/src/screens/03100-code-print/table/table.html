<table mat-table [dataSource]="tableDataSource" [trackBy]="trackById">

  <!-- Column -->
  <ng-container matColumnDef="tableName">
    <th mat-header-cell *matHeaderCellDef>类型</th>
    <td mat-cell *matCellDef="let item">{{ item.tableName | pipeCodePrintTableName }}</td>
  </ng-container>

  <!-- Column -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>备注</th>
    <td mat-cell *matCellDef="let item">{{ item.description }}</td>
  </ng-container>

  <!-- Column -->
  <ng-container matColumnDef="operatorName">
    <th mat-header-cell *matHeaderCellDef>打印人</th>
    <td mat-cell *matCellDef="let item">{{ item.operatorName }}</td>
  </ng-container>

  <!-- Column -->
  <ng-container matColumnDef="operateTime">
    <th mat-header-cell *matHeaderCellDef>打印时间</th>
    <td mat-cell *matCellDef="let item">{{ item.operateTime | timestamp }}</td>
  </ng-container>

  <!-- Column -->
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>操作</th>
    <td mat-cell *matCellDef="let item">
      <button matIconButton matTooltip="操作菜单"
              [matMenuTriggerFor]="templateOppMenu"
              [matMenuTriggerData]="{ item: item }"
              (menuOpened)="onOppMenuOpened(item)"
              (menuClosed)="onOppMenuClosed()">
        <mat-icon>apps</mat-icon>
      </button>
    </td>
  </ng-container>

  <!--thead 模板-->
  <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
  <!--tbody 模板-->
  <tr mat-row *matRowDef="let item; columns: columns;"
      [matContextMenuTriggerFor]="templateOppMenu"
      [matContextMenuTriggerData]="{ item: item }"
      (menuOpened)="onOppMenuOpened(item)"
      (menuClosed)="onOppMenuClosed()"
      [class.menu-opened]="oppMenuSelectedModelSig() === item"></tr>
</table>

<!--操作菜单-->
<ng-container>
  <mat-menu #templateOppMenu="matMenu" [hasBackdrop]="true">
    <ng-template matMenuContent let-item="item">

      <button mat-menu-item (click)="onView.emit(item)">
        <mat-icon>search</mat-icon>
        查看
      </button>

      <button mat-menu-item>
        <mat-icon>close</mat-icon>
        关闭
      </button>
    </ng-template>
  </mat-menu>

</ng-container>
