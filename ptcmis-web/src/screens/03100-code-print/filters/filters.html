<!--过滤条件区域-->
<ng-container [formGroup]="filterFormGroup">

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按类型过滤</mat-label>
    <mat-select formControlName="tableName">
      <mat-option value="">全部类型</mat-option>
      <mat-option value="tissue_task">{{ 'tissue_task' | pipeCodePrintTableName }}</mat-option>
      <mat-option value="bottle_code_complement_task">{{ 'bottle_code_complement_task' | pipeCodePrintTableName }}</mat-option>
      <mat-option value="inventory_add_bottle">{{ 'inventory_add_bottle' | pipeCodePrintTableName }}</mat-option>
      <mat-option value="bottle">{{ 'bottle' | pipeCodePrintTableName }}</mat-option>
    </mat-select>
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按备注过滤</mat-label>
    <mat-select formControlName="description">
      <mat-option value="">全部</mat-option>
      <mat-option value="单独打印任务子瓶瓶码">单独打印任务子瓶瓶码</mat-option>
      <mat-option value="批量打印任务子瓶瓶码">批量打印任务子瓶瓶码</mat-option>
      <mat-option value="单独打印瓶体补码">单独打印瓶体补码</mat-option>
      <mat-option value="批量打印瓶体补码">批量打印瓶体补码</mat-option>
      <mat-option value="单独打印库存增瓶">单独打印库存增瓶</mat-option>
      <mat-option value="批量打印库存增瓶">批量打印库存增瓶</mat-option>
      <mat-option value="补打瓶码">补打瓶码</mat-option>
    </mat-select>
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按人员过滤</mat-label>
    <input matInput formControlName="operatorName">
  </mat-form-field>

  <!--过滤条件-->
  <date-range formControlName="operateTime" label="按打印时间过滤"></date-range>

  <button matIconButton matTooltip="刷新" (click)="requestQuery()">
    <mat-icon>refresh</mat-icon>
  </button>

</ng-container>
