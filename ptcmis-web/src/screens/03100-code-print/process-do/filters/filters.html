<!--过滤条件区域-->
<ng-container [formGroup]="filterFormGroup">

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按瓶码前缀过滤</mat-label>
    <mat-select formControlName="codePrefix" tabindex="-1">
      <mat-option value="">全部</mat-option>
      @for (item of codePrefixList; track item) {
        <mat-option [value]="item">{{ item }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按品种编号/人员过滤</mat-label>
    <input matInput formControlName="keyword">
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按外植体采集批次过滤</mat-label>
    <input matInput type="number" min="0" formControlName="explantCollectionBatch">
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按代数过滤</mat-label>
    <input matInput type="number" min="0" formControlName="generation">
  </mat-form-field>

  <!--过滤条件-->
  <date-range formControlName="dateRange" label="按建瓶时间过滤"></date-range>

</ng-container>
