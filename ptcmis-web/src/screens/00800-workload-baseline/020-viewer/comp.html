<layout-drawer-opp-simple>

  <!--编辑区-->
  <fieldset data-content-for="content" class="form-container">
    <legend>查看绩效基线信息</legend>
    <div class="form">
      <mat-form-field appearance="outline" class="col1" floatLabel="always">
        <mat-label>员工</mat-label>
        <input matInput [value]="model.userName" readonly>
      </mat-form-field>
      <mat-form-field appearance="outline" class="col1" floatLabel="always">
        <mat-label>员工身份</mat-label>
        <input matInput [value]="model.userRole | taskUserRole" readonly>
      </mat-form-field>
      <div class="break"></div>
      <mat-form-field appearance="outline" class="col2" floatLabel="always">
        <mat-label>绩效种类</mat-label>
        <input matInput [value]="model.bizType | workloadTransactionBizType" readonly>
      </mat-form-field>
      <div class="break"></div>
      <mat-form-field appearance="outline" class="col1" floatLabel="always">
        <mat-label>品种</mat-label>
        <input matInput [value]="model.variety" readonly>
      </mat-form-field>
      <mat-form-field appearance="outline" class="col1" floatLabel="always">
        <mat-label>编号</mat-label>
        <input matInput [value]="model.varietyCode" readonly>
      </mat-form-field>
      <div class="break"></div>
      <mat-form-field appearance="outline" class="col2" floatLabel="always">
        <mat-label>代数</mat-label>
        <input matInput [value]="model.generation" readonly>
      </mat-form-field>
      <div class="break"></div>
      <mat-form-field appearance="outline" class="col1" floatLabel="always">
        <mat-label>瓶数基线</mat-label>
        <input matInput [value]="model.bottles" readonly>
      </mat-form-field>
      <mat-form-field appearance="outline" class="col1" floatLabel="always">
        <mat-label>株数基线</mat-label>
        <input matInput [value]="model.plants" readonly>
      </mat-form-field>
    </div>
  </fieldset>

  <!--操作按钮区-->
  <ng-container data-content-for="toolbar">
    <button matButton="text" (click)="requestCancel()">取消</button>
  </ng-container>

</layout-drawer-opp-simple>
