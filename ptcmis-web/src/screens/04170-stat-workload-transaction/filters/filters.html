<!--过滤条件区域-->
<ng-container [formGroup]="filterFormGroup">

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always" style="flex: 0 0 60px;">
    <mat-label>员工身份</mat-label>
    <mat-select formControlName="userRole">
      <mat-option value="operator">操作员</mat-option>
      <mat-option value="inspector">质检员</mat-option>
    </mat-select>
  </mat-form-field>

  <select-user label="员工" [canSelectEmpty]="true" optionEmptyText="全部员工" [formControl]="fcUser" style="flex: 0 0 120px;"></select-user>
  <select-variety label="品种" [canSelectEmpty]="true" optionEmptyText="全部品种" formControlName="variety" style="flex: 0 0 120px;"></select-variety>
  <select-variety-code-simple label="品种编号" [canSelectEmpty]="true" optionEmptyText="全部编号" formControlName="varietyCode"
                              [variety]="varietySig()" style="flex: 0 0 120px;"></select-variety-code-simple>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always" style="flex: 0 0 120px;">
    <mat-label>代数</mat-label>
    <input matInput type="number" formControlName="generation">
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always" style="flex: 0 0 60px;">
    <mat-label>统计周期</mat-label>
    <mat-select formControlName="dateType">
      <mat-option value="按月">按月</mat-option>
      <mat-option value="按季">按季</mat-option>
      <mat-option value="按年">按年</mat-option>
      <mat-option value="自定义">自定义</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" floatLabel="always" [class.hide]="dateTypeSig() === '自定义'" style="flex: 0 0 60px;">
    <mat-label>年份</mat-label>
    <input matInput type="number" min="1900" max="3000" [formControl]="fcYear">
  </mat-form-field>

  <mat-form-field appearance="outline" floatLabel="always" [class.hide]="dateTypeSig() !== '按月'" style="flex: 0 0 60px;">
    <mat-label>月份</mat-label>
    <mat-select [formControl]="fcMonth">
      <mat-option [value]="1">一月</mat-option>
      <mat-option [value]="2">二月</mat-option>
      <mat-option [value]="3">三月</mat-option>
      <mat-option [value]="4">四月</mat-option>
      <mat-option [value]="5">五月</mat-option>
      <mat-option [value]="6">六月</mat-option>
      <mat-option [value]="7">七月</mat-option>
      <mat-option [value]="8">八月</mat-option>
      <mat-option [value]="9">九月</mat-option>
      <mat-option [value]="10">十月</mat-option>
      <mat-option [value]="11">十一月</mat-option>
      <mat-option [value]="12">十二月</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" floatLabel="always" [class.hide]="dateTypeSig() !== '按季'" style="flex: 0 0 60px;">
    <mat-label>季度</mat-label>
    <mat-select [formControl]="fcQuarter">
      <mat-option [value]="1">一季度</mat-option>
      <mat-option [value]="2">二季度</mat-option>
      <mat-option [value]="3">三季度</mat-option>
      <mat-option [value]="4">四季度</mat-option>
    </mat-select>
  </mat-form-field>

  <date-range [formControl]="fcDateRange" label="统计时间" [class.hide]="dateTypeSig() !== '自定义'"></date-range>

  <button matButton="filled" (click)="requestExport()" style="min-width: 150px;">
    <mat-icon>download</mat-icon>
    导出表格
  </button>

  <button matIconButton matTooltip="刷新" (click)="requestQuery()">
    <mat-icon>refresh</mat-icon>
  </button>

</ng-container>
