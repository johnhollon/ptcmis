<layout-drawer-opp-simple>

  <fieldset class="form-container main-container" data-content-for="content">
    <legend>母代追溯</legend>
    <div style="height: 100%; display: flex; flex:1; align-items: stretch;">
      <cdk-virtual-scroll-viewport class="table-container" [itemSize]="52" [maxBufferPx]="2080" [minBufferPx]="840">
        <table-query-bottle [models]="service.parentsSig()" [columns]="columns"></table-query-bottle>
      </cdk-virtual-scroll-viewport>
    </div>
  </fieldset>


  <ng-container data-content-for="toolbar">
    <button matButton="text" (click)="onCancel.emit()">关闭</button>
  </ng-container>

</layout-drawer-opp-simple>
