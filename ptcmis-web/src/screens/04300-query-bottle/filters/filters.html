<!--过滤条件区域-->
<ng-container [formGroup]="filterFormGroup">

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按瓶码/品种/编号/人员过滤</mat-label>
    <input matInput formControlName="keyword">
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按外植体采集批次过滤</mat-label>
    <input matInput type="number" formControlName="explantCollectionBatch">
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按代数过滤</mat-label>
    <input matInput type="number" formControlName="generation">
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按淘汰过滤</mat-label>
    <mat-select formControlName="discarded">
      <mat-option value="">全部</mat-option>
      <mat-option value="0">未淘汰</mat-option>
      <mat-option value="1">已淘汰</mat-option>
    </mat-select>
  </mat-form-field>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label>按仓储状态过滤</mat-label>
    <mat-select formControlName="currentStorageStatus">
      <mat-option value="">全部</mat-option>
      <mat-option value="in">在库</mat-option>
      <mat-option value="out">出库</mat-option>
    </mat-select>
  </mat-form-field>

  <!--过滤条件-->
  <date-range formControlName="taskTime" label="按建瓶时间过滤"></date-range>

  <button matIconButton matTooltip="刷新" (click)="requestQuery()">
    <mat-icon>refresh</mat-icon>
  </button>

</ng-container>
