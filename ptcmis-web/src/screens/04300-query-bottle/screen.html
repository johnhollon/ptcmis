<!--页面主体-->
<layout-page-function-simple
  #pageRef
  [loading]="loadingSig()"
  [loadingMessage]="loadingMessageSig()"
  (onDrawerClosed)="onDrawerClosed()"
  (onDrawerOpened)="onDrawerOpened()"
>

  <!--标题区域-->
  <layout-page-function-simple-title titleText="代际追溯" data-content-for="title">
    <!--标题补充信息及插槽 titleDescriptionOutlet-->
    <ng-template cdkPortalOutlet #titleDescriptionOutlet data-content-for="description"></ng-template>
    <!--标题按钮区域及插槽 titleButtonsOutlet-->
    <ng-template cdkPortalOutlet #titleButtonsOutlet data-content-for="buttons"></ng-template>
  </layout-page-function-simple-title>

  <!--查询区域-->
  <layout-query-simple data-content-for="content">

    <!--过滤条件区域-->
    <filters-query-bottle data-content-for="filters"
                          (onFiltersChanged)="onFiltersChanged($event)"
                          (onQuery)="requestQuery()"
    ></filters-query-bottle>

    <!--查询结果区域-->
    <table-query-bottle data-content-for="table"
                        [models]="listSig()"
                        (onView)="requestView($event)"
    ></table-query-bottle>

    <!--分页区域-->
    <paginator data-content-for="pagination"
               [page]="paginationSig()"
               (change)="onPageChanged($event)"
               aria-label="Select page">
    </paginator>
  </layout-query-simple>

  <!--drawer区域及插槽 drawerOutlet-->
  <ng-template cdkPortalOutlet #drawerOutlet data-content-for="drawer"></ng-template>
</layout-page-function-simple>

<!--标题附属信息模板-->
<ng-container>
  <!--标题附属信息模板 - 查看详情 - titleDescriptionPortalView-->
  <ng-template #titleDescriptionPortalView>
    <sub-title-query-bottle subTitle="查看详情" [model]="selectedModelSig()"></sub-title-query-bottle>
  </ng-template>
</ng-container>

<!--标题按钮区域模板-->
<ng-container>
  <ng-template #titleButtonsPortalAdd>
    <button matButton="filled" (click)="requestScan()">
      <mat-icon>qr_code</mat-icon>
      扫码查询
    </button>
  </ng-template>
  <ng-template #titleButtonsPortalViewer>
    <div class="tabs">
      <div class="tab-title" [class.selected]="subModuleViewerSig() === 'baseInfo'" (click)="subModuleViewerSig.set('baseInfo')">
        培养瓶信息
      </div>
      <div class="tab-title" [class.selected]="subModuleViewerSig() === 'parent'" (click)="subModuleViewerSig.set('parent')">
        母代追溯
      </div>
      <div class="tab-title" [class.selected]="subModuleViewerSig() === 'children'" (click)="subModuleViewerSig.set('children')">
        子代追溯
      </div>
      <div class="tab-title" [class.selected]="subModuleViewerSig() === 'logs'" (click)="subModuleViewerSig.set('logs')">
        操作日志
      </div>
      <div class="tab-title" [class.selected]="subModuleViewerSig() === 'archive'" (click)="subModuleViewerSig.set('archive')">
        附件材料
      </div>
    </div>
  </ng-template>
</ng-container>

<!--编辑Drawer区域模板-->
<ng-container>
  <ng-template #drawerPortalView>
    <viewer-query-bottle
      [bottle]="selectedModelSig()"
      [subModule]="subModuleViewerSig()"
      (onCancel)="closeDrawer()"
      (onRequestStartLoading)="requestStartLoading($event)"
      (onRequestStopLoading)="requestStopLoading()"
    ></viewer-query-bottle>
  </ng-template>
</ng-container>
