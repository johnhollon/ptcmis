<!--页面主体-->
<layout-page-function-simple
  #pageRef
  [loading]="loadingSig()"
  [loadingMessage]="loadingMessageSig()"
>

  <!--标题区域-->
  <layout-page-function-simple-title titleText="我的账户"
                                     data-content-for="title">
  </layout-page-function-simple-title>

  <!--查询区域-->
  <div data-content-for="content">
    <layout-drawer-opp-simple>
      <fieldset data-content-for="content" class="form-container">
        <legend>我的账户</legend>
        <div class="form">
          <mat-form-field appearance="outline" class="col2 readonly" floatLabel="always">
            <mat-label>姓名</mat-label>
            <input matInput [value]="actionPassport.currentNameOfUser" readonly>
          </mat-form-field>
          <div class="break"></div>
          <mat-form-field appearance="outline" class="col2 readonly" floatLabel="always">
            <mat-label>登录名（手机号码）</mat-label>
            <input matInput [value]="actionPassport.currentUserAccount" readonly>
          </mat-form-field>
          <div class="break"></div>
          <mat-form-field appearance="outline" class="col2 readonly" floatLabel="always">
            <mat-label>账号类型</mat-label>
            <input matInput [value]="actionPassport.role | role" readonly>
          </mat-form-field>
          <div class="break"></div>
          <button matButton="filled" class="col2" (click)="requestUpdatePassword()">更改密码</button>
        </div>
      </fieldset>
    </layout-drawer-opp-simple>
  </div>
</layout-page-function-simple>
