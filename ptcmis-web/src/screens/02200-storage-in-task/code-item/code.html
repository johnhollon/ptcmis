<div class="code-main" (click)="onClick.emit(model!)">
  <div class="code">{{ model?.idBottle || '' }}</div>
  @if (model && (model?.plantCountActual || 0) > 0) {
    <div class="info" [matTooltip]="'瓶内' + (model?.plantCountActual || 0) + '株'">{{ (model?.plantCountActual || 0) }}</div>
  }
</div>
