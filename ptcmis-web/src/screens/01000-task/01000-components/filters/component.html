<!--过滤条件区域-->
<ng-container [formGroup]="filterFormGroup">

  <mat-form-field appearance="outline" floatLabel="always" style="flex: 0 0 200px;">
    <mat-label>按品种/编号/瓶码前缀/人员过滤</mat-label>
    <input matInput formControlName="keyword">
  </mat-form-field>

  @if (taskType === 'induction') {
    <mat-form-field appearance="outline" floatLabel="always" style="flex: 0 0 120px;">
      <mat-label>按外植体采集批次过滤</mat-label>
      <input type="number" min="0" matInput formControlName="explantCollectionBatch">
    </mat-form-field>
  }

  <selector-tissue-task-status formControlName="taskStatus" label="按执行状态过滤"></selector-tissue-task-status>

  <date-range formControlName="finishTime" label="按完成时间过滤"></date-range>

  <date-range formControlName="createTime" label="按创建时间过滤"></date-range>

  <date-range formControlName="startTime" label="按开始时间过滤"></date-range>

  <button matIconButton matTooltip="刷新" (click)="requestQuery()">
    <mat-icon>refresh</mat-icon>
  </button>
</ng-container>
