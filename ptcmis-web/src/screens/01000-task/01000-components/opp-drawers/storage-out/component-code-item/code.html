<div class="code-main">
  <p class="code">{{ id }}</p>
  <p class="info" style="margin-left: auto;">
    <span>{{ plantCount }}株</span>
  </p>
  @if (canOpp) {
    <div class="opp">
      @if (status === 'normal') {
        <button matIconButton (click)="onChecked.emit(id)" class="text-primary">
          <mat-icon [matTooltip]="assignTitle">{{ assignIconText }}</mat-icon>
        </button>
      }
      @if (status === 'done') {
        <button matIconButton (click)="onNormal.emit(id)" class="text-error">
          <mat-icon [matTooltip]="revertTitle">{{ revertIconText }}</mat-icon>
        </button>
      }
    </div>
  }
</div>
