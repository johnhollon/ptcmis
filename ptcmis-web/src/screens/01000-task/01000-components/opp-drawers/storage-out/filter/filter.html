<!--过滤条件区域-->
<ng-container [formGroup]="filterFormGroup">

  <!--过滤条件-->
  <selector-storage-in-out-status label="按出库状态过滤" formControlName="status" style="flex:0 0 140px;"></selector-storage-in-out-status>

  <!--过滤条件-->
  <mat-form-field appearance="outline" floatLabel="always" style="flex:0 0 110px;">
    <mat-label>按人员过滤</mat-label>
    <input matInput formControlName="name">
  </mat-form-field>

  <button matIconButton (click)="onRefresh.emit()">
    <mat-icon matTooltip="同步状态">sync</mat-icon>
  </button>
</ng-container>
