<tissue-task-process-stat-do [class.hidden]="subModuleSelected !== 'stat'"
                             (onCancel)="requestCancel()"
></tissue-task-process-stat-do>

<tissue-task-process-do [class.hidden]="subModuleSelected !== 'process'"
                        [editable]="editable"
                        (onCancel)="requestCancel()"
                        (onSaved)="onSaved.emit()"
                        (onRequestStartLoading)="onRequestStartLoading.emit($event)"
                        (onRequestStopLoading)="onRequestStopLoading.emit()"
></tissue-task-process-do>

<tissue-task-storage-out [class.hidden]="subModuleSelected !== 'storge-out'"
                         [editable]="editable && serviceTissueTaskProcess.taskSig().task.taskStatus !== 'finished'"
                         (onCancel)="requestCancel()"
                         (onSaved)="onSaved.emit()"
                         (onRequestStartLoading)="onRequestStartLoading.emit($event)"
                         (onRequestStopLoading)="onRequestStopLoading.emit()"
></tissue-task-storage-out>

<tissue-task-storage-in [class.hidden]="subModuleSelected !== 'storage-in'"
                        [editable]="storageInEnable && serviceTissueTaskProcess.taskSig().task.taskStatus === 'finished'"
                        (onCancel)="requestCancel()"
                        (onSaved)="onSaved.emit()"
                        (onRequestStartLoading)="onRequestStartLoading.emit($event)"
                        (onRequestStopLoading)="onRequestStopLoading.emit()"
></tissue-task-storage-in>

<tissue-task-archive [class.hidden]="subModuleSelected !== 'archive'"
                     [model]="model"
                     description="执行任务"
                     [editable]="editable && serviceTissueTaskProcess.taskSig().task.taskStatus !== 'finished'"
                     (onCancel)="requestCancel()"
                     (onRequestStartLoading)="onRequestStartLoading.emit($event)"
                     (onRequestStopLoading)="onRequestStopLoading.emit()"
></tissue-task-archive>
