<div class="code-main" [class.discard]="status === 'discard'" [class.used]="status === 'used'" [class.colored]="colored">
  <div class="signal"></div>
  <p class="code">{{ id }}</p>
  <p class="info" style="margin-left: auto;"
     [class.hide]="editingPlants">
    <span [matTooltip]="'株数: ' + plantCount">{{ plantCount }}株</span>
  </p>
  @if (canOpp) {
    <div class="opp" [class.hide]="editingPlants">
      @if (status !== 'used') {
        <button matIconButton (click)="onUsed.emit(id)">
          <mat-icon [matTooltip]="assignTitle">{{ assignIconText }}</mat-icon>
        </button>
      }
      @if (status !== 'none') {
        <button matIconButton (click)="onNone.emit(id)">
          <mat-icon [matTooltip]="revertTitle">{{ revertIconText }}</mat-icon>
        </button>
      }
    </div>
  }
</div>
