<!--过滤条件区域-->
<ng-container [formGroup]="filterFormGroup">


  <mat-form-field appearance="outline">
    <mat-label>按品种/编号/人员过滤</mat-label>
    <input matInput formControlName="keyword">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>按代数过滤</mat-label>
    <input matInput type="number" formControlName="parentGeneration">
  </mat-form-field>

  <selector-storage-in-out-status formControlName="status" label="按出库状态过滤"></selector-storage-in-out-status>

  <selector-tissue-task-type formControlName="taskType" label="按任务类别过滤"></selector-tissue-task-type>

  <selector-tissue-task-status formControlName="taskStatus" label="按任务状态过滤"></selector-tissue-task-status>

  <date-range formControlName="applicantTime" label="按申请时间过滤"></date-range>

  <date-range formControlName="operatorTime" label="按操作时间过滤"></date-range>

  <button matIconButton matTooltip="刷新" (click)="requestQuery()">
    <mat-icon>refresh</mat-icon>
  </button>

</ng-container>
