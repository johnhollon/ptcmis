# =========================================================================
##
#             在本文件内设置 npm install 所需的各类环境变量。
##
# =========================================================================


# =========================================================================
# Node / node‑gyp 编译头文件镜像
# 新版node‑gyp优先读取环境变量NODE_GYP_DIST_URL
# =========================================================================
NODE_GYP_DIST_URL=https://npmmirror.com/mirrors/node/
NODEJS_ORG_MIRROR=https://npmmirror.com/mirrors/node/
NODE_GYP_HOME=https://npmmirror.com/mirrors/node-gyp/

# =========================================================================
# 核心大文件二进制（目录地址末尾强制带上斜杠）
# =========================================================================
# 1. Electron 框架
# 关闭 Electron 自动下载二进制包（如需开启请注释此行，本项目构建Electron无需开启）
ELECTRON_SKIP_BINARY_DOWNLOAD=1
ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/

# 2. Puppeteer 浏览器驱动（区分新旧版本镜像地址）
# Puppeteer <20 旧版 Chromium‑browser‑snapshots
PUPPETEER_DOWNLOAD_HOST=https://npmmirror.com/mirrors/puppeteer/
PUPPETEER_DOWNLOAD_BASE_URL=https://npmmirror.com/mirrors/puppeteer/
# Puppeteer >=20 Chrome‑for‑Testing
PUPPETEER_CHROME_DOWNLOAD_BASE_URL=https://npmmirror.com/mirrors/chrome-for-testing/

# 3. Sharp、lib‑vips 图片处理
SHARP_BINARY_HOST=https://npmmirror.com/mirrors/sharp/
SHARP_DIST_BASE_URL=https://npmmirror.com/mirrors/sharp-libvips/

# 4. node‑sass 经典样式编译器
SASS_BINARY_SITE=https://npmmirror.com/mirrors/node-sass/

# =========================================================================
# 数据库原生模块
# =========================================================================
SQLITE3_BINARY_SITE=https://npmmirror.com/mirrors/sqlite3/
BETTER_SQLITE3_BINARY_HOST=https://npmmirror.com/mirrors/better-sqlite3/
SQLITE_CIPHER_BINARY_SITE=https://npmmirror.com/mirrors/sqlite-cipher/

# =========================================================================
# CLI、工具二进制
# =========================================================================
SENTRYCLI_CDNURL=https://npmmirror.com/mirrors/sentry-cli/
PHANTOMJS_CDNURL=https://npmmirror.com/mirrors/phantomjs/
FFMPEG_BINARIES_URL=https://npmmirror.com/mirrors/ffmpeg-static/
SEVENZIP_BINARY_HOST=https://npmmirror.com/mirrors/7zip/

# Python 编译镜像（供 node‑gyp 寻找本地环境失败时备用）
PYTHON_MIRROR=https://npmmirror.com/mirrors/python/

# =========================================================================
# 各类 Node‑NAPI / C++ 原生插件
# =========================================================================
CANVAS_PREBUILT_BINARY_HOST_MIRROR=https://npmmirror.com/mirrors/canvas-prebuilt/
PROFILER_BINARY_HOST_MIRROR=https://npmmirror.com/mirrors/node-inspector/
LZMA_NATIVE_BINARY_HOST_MIRROR=https://npmmirror.com/mirrors/lzma/
KEYTAR_BINARY_HOST=https://npmmirror.com/mirrors/keytar/
SERIALPORT_BINARY_HOST=https://npmmirror.com/mirrors/serialport/
USB_BINARY_HOST=https://npmmirror.com/mirrors/node-usb/
ROBOTJS_BINARY_HOST=https://npmmirror.com/mirrors/robot-js/
NODE_CURL_BINARY_HOST=https://npmmirror.com/mirrors/node-curl/
NAPI_RS_BINARY_MIRROR=https://npmmirror.com/mirrors/napi-rs/
DENO_SASS_BINARY_SITE=https://npmmirror.com/mirrors/deno-sass/
NATIVE_KEYMAP_BINARY_HOST=https://npmmirror.com/mirrors/native-keymap/
ELECTRON_TRAY_BINARY_HOST=https://npmmirror.com/mirrors/electron-tray/

# =========================================================================
# 其他现代构建工具
# =========================================================================
SWC_BINARY_SITE=https://npmmirror.com/mirrors/swc/
# Playwright 禁止自动下载浏览器（0表示跳过本地下载，改用全局路径或手动管理）
PLAYWRIGHT_BROWSERS_PATH=0

# 验证变量
NPM_INSTALL_RUN_IN_CORRECT_ENVIRONMENT_AND_THIS_IS_THE_VAR_TO_CHECK_IT=1
